name: Generate Daily Writing Prompt

on:
  schedule:
    # Runs at 21:00 UTC every day (generates the prompt for the following day)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allow manual triggers for testing

jobs:
  generate-prompt:
    name: Generate prompt for tomorrow
    runs-on: ubuntu-latest
    steps:
      - name: Call generate endpoint
        run: |
          HTTP_STATUS=$(curl --silent --output response.json --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --header "Content-Type: application/json" \
            "${{ secrets.PROMPTER_API_URL }}/prompts/generate")

          echo "Response body:"
          cat response.json

          if [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Unexpected HTTP status: $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Prompt generated successfully (HTTP $HTTP_STATUS)"

